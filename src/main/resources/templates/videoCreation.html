<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Upload - Video sharing service</title>
  <link th:rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header>
  <a th:href="@{/}" class="titlesLink">
    <h1 class="titles">Video sharing service</h1>
  </a>
  <div class="users">
    <ul class="navigation">
      <li class="nav">
        <a th:href="@{/}">
          <button type="button" class="buttonsUsers">Back to Home Page</button>
        </a>
      </li>
    </ul>
  </div>
</header>

<main>
  <form th:action="@{'/channel/' + ${channelName} + '/videos/post'}"
        method="post"
        enctype="multipart/form-data"
        class="form">
    <h2>Upload a new video</h2>

    <div class="form-group">
      <label for="title">Video Title</label>
      <input type="text" id="title" name="title" required class="form-input" placeholder="Enter video title...">
    </div>

    <div class="form-group">
      <label for="description">Video Description</label>
      <textarea id="description" name="description" rows="4" required class="form-input form-textarea" placeholder="Enter video description..."></textarea>
    </div>

    <div class="form-group">
      <label for="file">Video File</label>
      <input type="file" id="file" name="file" accept="video/*" required class="form-input">
    </div>

    <div class="form-group">
      <label for="thumbnail">Thumbnail Image</label>
      <input type="file" id="thumbnail" name="thumbnail" accept="image/*" required class="form-input">
    </div>

    <div class="form-group">
      <label for="videoUrl">External Video URL (Optional)</label>
      <input type="url" id="videoUrl" name="videoUrl" class="form-input" placeholder="https://example.com/video">
    </div>

    <div class="form-actions">
      <button type="submit" class="buttonsConfirm">Upload Video</button>
    </div>
  </form>
</main>

<footer>
  <div class="contents">
    <p id="contents_text">This site was made by a student from Subotica</p>
  </div>
</footer>

</body>
</html>
