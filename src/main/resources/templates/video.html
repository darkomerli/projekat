<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${video.getTitle()} + ' - My Youtube Page'">My Youtube Page - Video</title>
    <link th:rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="header-container">
    <div class="header-left">
        <a th:href="@{/}" class="titlesLink">
            <h1 class="titles">Darko's YouTube copy</h1>
        </a>
    </div>

    <form th:action="@{/search}" method="get" class="search-form-center">
        <input
                type="text"
                name="keyword"
                class="form-input"
                placeholder="Search videos or channels..."
                th:value="${keyword}"
                required
        />
        <button type="submit" class="buttonsUsers">Search</button>
    </form>

    <div class="header-right">
        <div class="users">
            <ul class="navigation">
                <li class="nav">
                    <a th:href="@{/}">
                        <button type="button" class="buttonsUsers">Back to Home Page</button>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>

<main>
    <h2 th:text="${video.getTitle()}" class="greeting video-main-title"></h2>

    <div class="contentsOfPage">
        <div id="left-side">
            <div id="video-items">
                <div class="video-player">
                    <video controls style="border-radius: 8px;">
                        <source th:src="@{'/videos/stream/' + ${video.getId()}}" th:type="${video.getContentType() != null ? video.getContentType() : 'video/mp4'}">
                        Your browser does not support HTML5 video streaming.
                    </video>
                </div>

                <div id="under-vid">
                    <div>
                        <a th:href="@{'/channel/' + ${video.getPostedChannel().getChannelName()}}"
                           th:text="${video.getPostedChannel().getChannelName()}"
                           id="channel-name" class="channel-link"></a>
                        <p th:text="'Subscribers: ' + ${video.getPostedChannel().getSubscribers()}"></p>
                    </div>

                    <div class="video-actions">
                        <th:block sec:authorize="isAuthenticated()">
                            <a th:if="${video.getPostedChannel().getUser().getUsername()} != ${username} and ${!exists}"
                               th:href="@{'/channel/' + ${video.getPostedChannel().getChannelName()} + '/subscribeFromVideo/' + ${video.getId()}}"
                               class="ajax-action">
                                <button type="button" class="buttonsUsers">Subscribe</button>
                            </a>
                            <a th:if="${exists}"
                               th:href="@{'/channel/' + ${video.getPostedChannel().getChannelName()} + '/unsubscribeFromVideo/' + ${video.getId()}}"
                               class="ajax-action">
                                <button type="button" class="buttonsUsers">Unsubscribe</button>
                            </a>
                        </th:block>

                        <th:block sec:authorize="isAuthenticated()">
                            <a th:if="${!hasLiked}" th:href="@{'/videos/' + ${video.getId()} + '/like'}" class="ajax-action">
                                <button type="button" class="buttonsUsers">Like</button>
                            </a>
                            <a th:if="${hasLiked}" th:href="@{'/videos/' + ${video.getId()} + '/unlikeFromVideo'}" class="ajax-action">
                                <button type="button" class="buttonsUsers">Unlike</button>
                            </a>
                        </th:block>
                    </div>

                    <div>
                        <p th:text="'Likes: ' + ${video.getLikes()}"></p>
                        <p th:text="'Views: ' + ${video.getViews()}"></p>
                    </div>
                </div>

                <div id="video-desc-container">
                    <p class="video-desc-comments"><b>Description:</b></p>
                    <p th:text="${video.getDescription()}" id="video-desc"></p>
                </div>

                <div id="comments-container">
                    <p class="video-desc-comments"><b>Comments:</b></p>

                    <div id="leave-a-comment" sec:authorize="isAuthenticated()">
                        <form th:action="@{'/videos/' + ${video.getId()}}" method="post" id="form-leave-a-comment">
                            <input type="text" name="content" placeholder="Add a comment..." required class="form-input comment-input">
                            <button type="submit" class="buttonsConfirm">Submit a Comment</button>
                        </form>
                    </div>

                    <div id="comments">
                        <th:block th:if="${!commentsCheck}">
                            <p class="no-comments">This video has no comments.</p>
                        </th:block>
                        <th:block th:if="${commentsCheck}">
                            <ul class="comments-list">
                                <li th:each="comment : ${comments}" class="comment-item">
                                    <div class="comment-card">
                                        <div class="comment-header">
                                            <strong class="comment-author" th:text="${comment.getUserComm().getUsername()}"></strong>

                                            <div class="buttonForDeleting">
                                                <a th:href="@{'/videos/' + ${video.getId()} + '/comment/' + ${comment.getId()}}"
                                                   th:if="${comment.getUserComm().getUser_id()} == ${idOfUser}"
                                                   id="delete-Comment"
                                                   class="ajax-action"
                                                   title="Delete Comment">
                                                    <button type="button" class="btn-delete-comment">✕</button>
                                                </a>
                                            </div>
                                        </div>
                                        <div class="comment-body">
                                            <p th:text="${comment.getContent()}"></p>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>

        <div id="right-side">
            <h3 class="sidebar-heading">Up Next</h3>
            <ul class="myProfileChannelLists sidebar-list">
                <li th:each="video : ${listOfVideos}" th:if="${video.getId()} != ${MainId}">
                    <div class="item">
                        <a th:href="@{'/videos/' + ${video.getId()}}">
                            <img th:src="${video.thumbnailData != null ? '/videos/thumbnail/' + video.getId() : 'data:image/svg+xml;utf8,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot;></svg>'}"
                                 class="imgThumb" alt="Video Thumbnail">
                        </a>
                        <div class="underPhoto">
                            <div class="titleDiv">
                                <a th:href="@{'/videos/' + ${video.getId()}}">
                                    <h3 class="title" th:text="${video.getTitle()}"></h3>
                                </a>
                            </div>
                            <div class="dataDiv">
                                <div class="usersname">
                                    <a class="userName"
                                       th:text="${video.getPostedChannel().getChannelName()}"
                                       th:href="@{'/channel/' + ${video.getPostedChannel().getChannelName()}}"></a>
                                </div>
                                <div class="underUsername">
                                    <p class="views" th:text="${video.getViews()} + ' views'"></p>
                                    <p class="date" th:text="${#temporals.format(video.getDatePosted(), 'dd.MM.yyyy.')}"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</main>

<footer>
    <div class="contents">
        <p id="contents_text">This site was made by a student from Subotica</p>
    </div>
</footer>

<script>
    document.addEventListener("DOMContentLoaded", () => {

        async function executeAjax(url, method = 'GET', body = null) {
            try {
                const options = { method };
                if (body) options.body = body;

                const response = await fetch(url, options);
                if (!response.ok) return;

                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                const newUnderVid = doc.querySelector('#under-vid');
                if (newUnderVid) {
                    document.querySelector('#under-vid').innerHTML = newUnderVid.innerHTML;
                }

                const newComments = doc.querySelector('#comments-container');
                if (newComments) {
                    document.querySelector('#comments-container').innerHTML = newComments.innerHTML;
                }

                attachEventListeners();
            } catch (err) {
                console.error('AJAX request failed:', err);
            }
        }

        function attachEventListeners() {
            document.querySelectorAll('a.ajax-action').forEach(link => {
                link.onclick = (e) => {
                    e.preventDefault();
                    executeAjax(link.getAttribute('href'), 'GET');
                };
            });

            const commentForm = document.getElementById('form-leave-a-comment');
            if (commentForm) {
                commentForm.onsubmit = (e) => {
                    e.preventDefault();
                    const formData = new FormData(commentForm);
                    executeAjax(commentForm.getAttribute('action'), 'POST', formData);
                };
            }
        }

        attachEventListeners();
    });
</script>

</body>
</html>
