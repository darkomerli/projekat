<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video sharing service - Login</title>
  <link th:rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header>
  <h1>Login</h1>
  <div class="users">
    <a th:href="@{/}">
      <button class="buttonsUsers">Back to Main Page</button>
    </a>
  </div>
</header>

<main>
  <form th:action="@{/login}" method="post" class="form">
    <h2>Login as an existing user</h2>

    <div class="form-group">
      <label for="username">User Name</label>
      <input type="text" id="username" name="username" class="form-input" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-input" required>
    </div>

    <div class="form-actions">
      <button type="submit" class="buttonsConfirm">Submit</button>
    </div>
  </form>
</main>

<footer>
  <div class="contents">
    <p id="contents_text">This site was made by a student from Subotica</p>
  </div>
</footer>

</body>
</html>
