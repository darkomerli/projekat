<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video sharing service - Channel</title>
    <link th:rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header>
    <a th:href="@{/}" class="titlesLink">
        <h1 class="titles">Video sharing service</h1>
    </a>
    <div class="users">
        <ul class="navigation">
            <li class="nav">
                <a th:href="@{/}">
                    <button class="buttonsUsers">Back to Home Page</button>
                </a>
            </li>
        </ul>
    </div>
</header>

<main>
    <th:block th:each="channel : ${channels}">
        <div id="mainInfo">
            <h2 th:text="${channel.getChannelName()}" class="greeting"></h2>
            <div id="subscriptionsAndInfo">
                <h3 th:text="${channel.getSubscribers()} + ' Subscribers'" class="channel-subscribers"></h3>
                <a sec:authorize="isAuthenticated()"
                   th:if="${channel.getUser().getUsername()} != ${username} and ${!exists}"
                   th:href="'/channel/' + ${channel.getChannelName()} + '/subscribe'">
                    <button class="buttonsUsers">Subscribe</button>
                </a>
                <a sec:authorize="isAuthenticated()"
                   th:if="${exists}"
                   th:href="'/channel/' + ${channel.getChannelName()} + '/unsubscribe'">
                    <button class="buttonsUsers">Unsubscribe</button>
                </a>
            </div>
        </div>
    </th:block>

    <th:block th:each="channel : ${channels}">
        <div id="channel-description">
            <h3>Channel description</h3>
            <div id="desc">
                <p th:text="${channel.getDescription()}"></p>
            </div>
        </div>
    </th:block>

    <div id="channel-videos">
        <h3>Channel videos</h3>

        <th:block th:each="channel : ${channels}" th:if="${channel.getUser().getUsername()} == ${username}">
            <div class="action-bar">
                <a th:href="'/channel/' + ${channel.getChannelName()} + '/videos/upload'">
                    <button class="buttonsUsers">Upload a video</button>
                </a>
            </div>
        </th:block>

        <ul id="myProfileChannelListsChannel">
            <li th:each="video:${videos}">
                <div class="itemChannel">
                    <a th:href="'/videos/' + ${video.getId()}">
                        <img th:src="${video.thumbnailData != null ? '/videos/thumbnail/' + video.getId() : 'data:image/svg+xml;utf8,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot;></svg>'}"
                             class="imgThumb" alt="Video Thumbnail">
                    </a>
                    <div class="underPhoto">
                        <div class="titleDiv">
                            <a th:href="'/videos/' + ${video.getId()}">
                                <h3 class="title" th:text="${video.getTitle()}"></h3>
                            </a>
                            <div class="buttonForDeleting" sec:authorize="isAuthenticated()" th:if="${video.getPostedChannel().getUser().getUsername()} == ${username}">
                                <a th:href="@{'/videos/' + ${video.getId()} + '/deleteFromChannel'}" title="Delete Video">
                                    <button type="button" class="btn-delete-comment">✕</button>
                                </a>
                            </div>
                        </div>
                        <div class="dataDiv">
                            <div class="usersname">
                                <a class="userName"
                                   th:text="${video.getPostedChannel().getChannelName()}"
                                   th:href="'/channel/' + ${video.getPostedChannel().getChannelName()}"></a>
                            </div>
                            <div class="underUsername">
                                <p class="views" th:text="${video.getViews()} + ' views'"></p>
                                <p class="date" th:if="${video.getDatePosted() != null}" th:text="${#temporals.format(video.getDatePosted(), 'dd.MM.yyyy.')}">18.08.2026.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</main>

<footer>
    <div class="contents">
        <p id="contents_text">This site was made by a student from Subotica</p>
    </div>
</footer>

</body>
</html>
